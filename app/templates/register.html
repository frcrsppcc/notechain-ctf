<!DOCTYPE html>
<html>
<head>
    <title>Register - NoteChain</title>
    <meta charset="utf-8">
    <style>
        body { font-family: monospace; max-width: 400px; margin: 50px auto; padding: 20px; background: #0d1117; color: #c9d1d9; }
        input { width: 100%; padding: 8px; margin: 5px 0; background: #161b22; border: 1px solid #30363d; color: #c9d1d9; }
        button { padding: 8px 20px; background: #238636; border: none; color: #fff; cursor: pointer; }
        a { color: #58a6ff; }
    </style>
</head>
<body>
    <h2>register</h2>
    <form method="POST">
        <p><input type="text" name="username" placeholder="username"></p>
        <p><input type="password" name="password" placeholder="password"></p>
        <p><button type="submit">register</button></p>
    </form>
    <p><a href="/login">login</a> | <a href="/">home</a></p>
</body>
</html>
