services:
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      default:
        aliases:
          - app.ctf.local
          - api.ctf.local

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    volumes:
      - ./app:/app
    environment:
      - FLAG=CTF{cs1rf_c00k1e_t0ss1ng_ftw}
    networks:
      default:
        aliases:
          - app.ctf.local
          - api.ctf.local

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    ports:
      - "8888:8888"
    depends_on:
      - nginx
    environment:
      - APP_URL=http://app.ctf.local
    networks:
      default:
        aliases:
          - bot.ctf.local
